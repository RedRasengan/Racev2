<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3eb">
<title>Atlas of Us — Daily cultural geography puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--ink:#172b27;--muted:#748078;--paper:#f5f2ea;--white:#fffefa;--green:#1d5749;--line:#e7e4da;--orange:#df7048;--shadow:0 12px 40px #193c2910}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'DM Sans',Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:1160px;margin:auto;padding:0 38px}.topbar{height:80px;border-bottom:1px solid #e8e4da;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand-mark{width:37px;height:37px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:20px}.brand-name{font:800 17px Manrope,sans-serif}.brand-name span{color:var(--orange)}.nav{display:flex;gap:7px;align-items:center}.nav button{border:0;background:transparent;border-radius:9px;padding:10px 15px;color:#68756f;font-weight:700}.nav button.active{background:#e7ebe3;color:var(--green)}main{padding:42px 0 70px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:var(--green)}.heading-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}.heading-row h1{font:800 33px/1.15 Manrope,sans-serif;letter-spacing:-1.5px;margin:8px 0 5px}.heading-row p{margin:0;color:var(--muted)}.streak{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.streak strong{display:block}.streak small{color:var(--muted);font-size:10px}.game-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(265px,.85fr);gap:22px}.card,.side-card,.lesson-card{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.portrait{height:270px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#dfe9db,#ebc9a7)}.portrait-art{width:170px;height:210px;border-radius:90px 90px 30px 30px;background:#d7a985;position:relative;box-shadow:0 18px 40px #5a4a3b22}.portrait-art:before{content:'';position:absolute;width:126px;height:126px;border-radius:50%;background:#b77f5b;left:22px;top:-34px}.portrait-art:after{content:'';position:absolute;width:92px;height:48px;border-radius:50% 50% 20% 20%;background:#3c302b;left:39px;top:-45px}.portrait-caption{position:absolute;left:18px;top:18px;border-radius:20px;background:#fffefaeb;padding:7px 12px;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.question-body{padding:25px 27px}.question-title{font:800 22px/1.3 Manrope;margin:0 0 7px}.question-copy{color:var(--muted);font-size:13px;margin:0 0 17px}.clues{display:grid;gap:8px;margin-bottom:20px}.clue{background:#f3f4ee;border-radius:9px;padding:10px 12px;font-size:12px}.clue b{color:var(--green);margin-right:8px}.answer-label{font-size:11px;font-weight:800;color:#7a847d;margin-bottom:9px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer-btn{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;text-align:left;font-weight:700;display:flex;justify-content:space-between}.answer-btn:hover:not(:disabled){border-color:#82a48e;background:#f7faf6}.answer-btn.correct{border-color:#4e9072;background:#edf6ef}.answer-btn.wrong{border-color:#c98267;background:#fff3ed}.answer-btn:focus-visible,.nav button:focus-visible,.primary:focus-visible{outline:3px solid #e4ad65;outline-offset:2px}.feedback{margin-top:16px;border-radius:12px;background:#edf4ec;padding:14px;font-size:12px;line-height:1.65}.feedback strong{display:block;font-size:14px;margin-bottom:3px}.feedback button,.primary{border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;padding:11px 16px}.feedback button{margin-top:12px}.side-card{overflow:hidden}.side-title{font:800 15px Manrope;margin:0;padding:18px}.lesson-link{width:100%;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;padding:14px 18px;display:flex;gap:10px}.lesson-link strong,.lesson-link small{display:block}.lesson-link small{color:var(--muted);margin-top:2px}.side-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.side-stat{padding:14px 18px}.side-stat+div{border-left:1px solid var(--line)}.side-stat span,.side-stat strong{display:block}.side-stat span{font-size:10px;color:var(--muted)}.note-card{margin-top:16px;border-radius:13px;background:#e8eee6;padding:15px;color:#506258;font-size:12px}.learn-head{margin-bottom:25px}.learn-head h1{font:800 34px Manrope;margin:8px 0}.learn-head p{max-width:680px;color:var(--muted)}.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.lesson-card{padding:21px 23px}.lesson-card h2{font:800 17px Manrope;margin:8px 0}.lesson-card p{color:#66746c;font-size:12px}.trait-box{margin-top:12px;background:#f4f4ed;border-radius:9px;padding:11px;font-size:11px}.trait-box strong{color:var(--green)}.learn-foot{margin-top:20px;border-radius:12px;background:#e8eee6;padding:15px 18px;font-size:12px}.empty-state{text-align:center;padding:38px 20px}.empty-state h2{font:800 25px Manrope}.empty-state p{color:var(--muted);max-width:390px;margin:0 auto 18px}.footer{text-align:center;color:#869089;font-size:10px;padding:0 0 25px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.guess-form{display:flex;gap:10px;margin-top:12px}.guess-form input{flex:1;min-width:0;border:1px solid #d5d9d1;border-radius:10px;background:#fff;padding:12px 14px;font:inherit;color:var(--ink)}.guess-form input:focus{outline:3px solid #1d574933;border-color:var(--green)}.guess-form button{border:0;border-radius:10px;background:var(--green);color:white;font-weight:700;padding:0 18px}.guess-form button:disabled{opacity:.55;cursor:not-allowed}.guess-count{color:var(--muted);font-size:13px;margin:9px 0}.guess-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}.guess-list li{border:1px solid var(--line);border-radius:9px;padding:8px 11px;display:flex;justify-content:space-between;gap:12px}.guess-list .miss{color:#8a5a38}.guess-list .hit{color:var(--green);font-weight:700}.answer-help{font-size:13px;color:var(--muted);margin:4px 0}.guess-form button:focus-visible,.guess-list li:focus-visible{outline:3px solid #1d574966;outline-offset:2px}@media(max-width:800px){.app{padding:0 22px}.game-layout{grid-template-columns:1fr}.portrait{height:220px}.lesson-grid{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:0 15px}.topbar{height:68px}.brand-name{font-size:15px}.nav button{padding:8px 10px}.heading-row h1{font-size:28px}.portrait{height:190px}.portrait-art{transform:scale(.85)}.question-body{padding:20px 16px}.answers{grid-template-columns:1fr}.lesson-grid{grid-template-columns:1fr}.learn-head h1{font-size:29px}main{padding-top:27px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app">
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">⌖</span><span class="brand-name">atlas <span>of us</span></span></a><nav class="nav" aria-label="Main navigation"><button id="playTab" class="active">Today</button><button id="learnTab">Learn</button></nav></header>
<main id="main"></main><footer class="footer">Daily clues, better context. &nbsp;·&nbsp; Made for thoughtful explorers.</footer>
</div>
<script>
const puzzle={
  name:'Dua Lipa', region:'London & Kosovo/Albania', short:'London / Kosovo',
  imageNote:'Licensed portrait slot',
  clues:['Born in London to parents from Kosovo.','Raised partly around Albanian-language culture.','Her family later named Pristina, Kosovo, as an important cultural connection.'],
  traits:{languages:'Albanian and English are important in her documented family and cultural story.',culture:'Kosovar Albanian music, food, migration and diaspora traditions vary widely.',nuance:'London, Kosovo and Albanian identity describe distinct connections; appearance does not determine any of them.'},
  lesson:'London & Kosovo/Albania', sources:'Portrait and biographical sources to add before launch.'
};
const lessons=[
 {icon:'🗺️',title:'Documented context, not appearance',text:'Birthplace, language, family history and community ties provide clues to a person’s story. Appearance cannot establish identity.',traits:'A person may have several regional connections.',example:'London and Kosovo describe different parts of a documented life.'},
 {icon:'🗣️',title:'Languages are living clues',text:'People may speak a national, local or family language while living anywhere in the world. One family can use several languages.',traits:'Albanian has regional and diaspora forms; English is used by many people worldwide.',example:'Language does not predict a person’s face.'},
 {icon:'🌊',title:'Diaspora is more than distance',text:'Migration can connect a person with several places across generations.',traits:'Diaspora traditions may be maintained, adapted or reinvented.',example:'Community events and family ties can matter as much as birthplace.'},
 {icon:'🍲',title:'Common traits are patterns',text:'Food, music, festivals and clothing can be meaningful cultural patterns—not universal rules.',traits:'Some traditions are widely shared while families differ in how they practice them.',example:'Never assume that a person follows every tradition associated with a place.'}
];
const main=document.querySelector('#main');
let mode='play',answered=false,solved=false,guesses=[],streak=Number(localStorage.getItem('atlasStreak')||0);
const maxGuesses=6;
function isCorrectGuess(value){const words=value.toLowerCase().match(/[a-z]+/g)||[];return words.includes('london')&&(words.includes('kosovo')||words.includes('albania'));}
function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function submitGuess(event){event.preventDefault();if(answered)return;const input=document.querySelector('#guessInput');const value=input.value.trim();if(!value)return;guesses.push(value);if(isCorrectGuess(value)){answered=true;solved=true;streak++;localStorage.setItem('atlasStreak',String(streak));}else if(guesses.length>=maxGuesses){answered=true;}renderGame();if(!answered)document.querySelector('#guessInput')?.focus();}
function updateTabs(){document.querySelector('#playTab').classList.toggle('active',mode==='play');document.querySelector('#learnTab').classList.toggle('active',mode==='learn')}
function renderGame(){
 mode='play';updateTabs();
 main.innerHTML=`<div class="heading-row"><div><div class="eyebrow">DAILY PUZZLE · NOV 22</div><h1>Which regions fit the story?</h1><p>Type the place connections using the clues—not the face.</p></div><div class="streak"><strong>🔥 ${streak}</strong><small>day streak</small></div></div>
 <div class="game-layout"><section class="card"><div class="portrait"><span class="portrait-caption">TODAY’S PROFILE · IMAGE PLACEHOLDER</span><div class="portrait-art" role="img" aria-label="Illustrated portrait placeholder for ${puzzle.name}"></div></div>
 <div class="question-body"><div class="question-title">Where does ${puzzle.name}’s story connect?</div><p class="question-copy">Appearance is not a clue. Use the documented profile clues below.</p><div class="clues">${puzzle.clues.map((c,i)=>`<div class="clue"><b>${i+1}</b>${c}</div>`).join('')}</div><div class="answer-label">YOUR GUESS</div><p class="answer-help">Type both place connections. You have ${maxGuesses} tries.</p>${guesses.length?`<ol class="guess-list" aria-label="Previous guesses">${guesses.map(g=>`<li><span>${escapeHtml(g)}</span><span class="${isCorrectGuess(g)?'hit':'miss'}">${isCorrectGuess(g)?'✓ Correct':'Not the full connection'}</span></li>`).join('')}</ol>`:''}${!answered?`<form class="guess-form" id="guessForm"><input id="guessInput" type="text" maxlength="80" autocomplete="off" placeholder="Type your answer…" aria-label="Type both place connections" required><button type="submit">Guess</button></form><div class="guess-count">${guesses.length} / ${maxGuesses} guesses used</div>`:''}${answered?`<div class="feedback" role="status"><strong>${solved?'That’s the documented connection!':'That’s all six tries—here is the documented connection.'}</strong><br><b>${puzzle.region}</b><br>${puzzle.traits.nuance}<div style="margin-top:8px"><b>Common context:</b> ${puzzle.traits.languages} ${puzzle.traits.culture}</div><button id="learnRegion">Explore this context →</button></div>`:''}</div></section>
 <aside><section class="side-card"><h2 class="side-title">A little field guide</h2>${lessons.slice(0,3).map((l,i)=>`<button class="lesson-link" data-lesson="${i}"><span>${l.icon}</span><span><strong>${l.title}</strong><small>${['Identity is documented','Language varies','Diaspora connects'][i]}</small></span></button>`).join('')}<div class="side-stats"><div class="side-stat"><span>Streak</span><strong>${streak} days</strong></div><div class="side-stat"><span>Today</span><strong>1 puzzle</strong></div></div></section><div class="note-card"><b>Curiosity, with care</b><br>Faces do not reveal nationality or ancestry. This puzzle uses verified life and cultural context.</div></aside></div>`;
 document.querySelector('#guessForm')?.addEventListener('submit',submitGuess);
 document.querySelector('#learnRegion')?.addEventListener('click',()=>renderLearn(0));
 document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>renderLearn(Number(b.dataset.lesson)));}
function renderLearn(focus=0){mode='learn';updateTabs();main.innerHTML=`<section class="learn-head"><div class="eyebrow">THE FIELD GUIDE</div><h1>Learn cultural context.</h1><p>Common traits can help explain communities, but they are patterns—not rules or appearance cues.</p></section><section class="lesson-grid">${lessons.map((l,i)=>`<article class="lesson-card" ${i===focus?'id="focus-lesson"':''}><div>${l.icon}</div><h2>${l.title}</h2><p>${l.text}</p><div class="trait-box"><strong>Common pattern:</strong> ${l.traits}<br><br><strong>Keep in mind:</strong> ${l.example}</div></article>`).join('')}</section><div class="learn-foot"><b>Post-puzzle context:</b> ${puzzle.lesson} includes ${puzzle.traits.languages} ${puzzle.traits.culture}</div><div style="margin-top:22px"><button class="primary" id="backToday">Back to today’s puzzle →</button></div>`;document.querySelector('#backToday').onclick=renderGame;if(focus)document.querySelector('#focus-lesson')?.scrollIntoView({behavior:'smooth',block:'center'})}
document.querySelector('#playTab').onclick=renderGame;document.querySelector('#learnTab').onclick=()=>renderLearn();renderGame();
</script></body></html>
